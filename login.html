<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMConnect Survey Results</title>
<style>
  :root { --blue: #0060A9; --slate: #231F20; --grey: #6D6E71; --line: #D9DADB; --bg: #F5F6F7; --red: #C73935; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--slate); font: 16px/1.45 Arial, Helvetica, sans-serif; padding: 16px; }
  form { width: 100%; max-width: 360px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 20px; margin: 12px 0 4px; }
  p { color: var(--grey); margin: 0 0 20px; font-size: 14px; }
  label { display: block; text-align: left; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; letter-spacing: .08em; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  button { margin-top: 16px; width: 100%; padding: 12px; background: var(--blue); color: #fff; border: 0; border-radius: 8px; font: bold 16px Arial, sans-serif; cursor: pointer; }
  .error { color: var(--red); font-weight: bold; font-size: 14px; margin: 12px 0 0; }
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <img src="/logo.svg" alt="ASEAN emblem">
  <h1>AMConnect survey results</h1>
  <p>Enter the passcode to view results and download data.</p>
  <label for="passcode">Passcode</label>
  <input id="passcode" name="passcode" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">View results</button>
  <p class="error" id="error" role="alert"></p>
</form>
<script>
  if (new URLSearchParams(location.search).has('wrong'))
    document.getElementById('error').textContent = 'That passcode is not correct. Please try again.';
</script>
</body>
</html>
