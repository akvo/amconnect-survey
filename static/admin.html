<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMConnect Survey Results</title>
<style>
  :root { --blue: #0060A9; --blue-dark: #004A82; --slate: #231F20; --grey: #6D6E71; --line: #E3E4E5; --tint: #E6EFF7; --bg: #F3F5F7; --red: #C73935; --yellow: #FCEE21; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--slate); font: 15px/1.45 Arial, Helvetica, sans-serif; }
  .topbar { background: #fff; border-bottom: 1px solid var(--line); }
  .topbar .in { max-width: 1080px; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 44px; height: 44px; }
  .brand h1 { font-size: 20px; margin: 0; }
  .brand .sub { color: var(--grey); font-size: 13px; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; margin-right: 6px; vertical-align: 1px; }
  .stripe { display: flex; height: 4px; } .stripe i { flex: 1; } .stripe i:nth-child(1) { background: var(--blue); } .stripe i:nth-child(2) { background: #EF3E33; } .stripe i:nth-child(3) { background: var(--yellow); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, .btn { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--slate); text-decoration: none; }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: bold; }
  .btn.primary:hover { background: var(--blue-dark); }
  .btn.ghost { border-color: transparent; color: var(--grey); }
  .btn:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .tile .label { color: var(--grey); font-size: 13px; }
  .tile .value { font-size: 34px; font-weight: bold; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .value.small { font-size: 18px; line-height: 1.3; margin-top: 8px; }
  .tile.hero { background: var(--blue); border-color: var(--blue); color: #fff; }
  .tile.hero .label { color: #D6E6F3; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 16px; }
  .card h2 { font-size: 17px; margin: 0; display: flex; gap: 10px; align-items: baseline; }
  .chip { flex: none; font-size: 12px; font-weight: bold; color: var(--blue); background: var(--tint); border-radius: 999px; padding: 2px 9px; }
  .note { color: var(--grey); font-size: 13px; margin: 6px 0 14px; }
  .warn { background: #FBECEB; color: var(--red); border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 14px; margin-top: 16px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 180px) 76px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .opt { font-size: 14px; } .opt .code { color: var(--grey); font-size: 12px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .mod { display: block; color: var(--grey); font-size: 12px; margin-top: 2px; }
  .bar { height: 10px; background: var(--tint); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 5px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: bold; }
  .num small { display: block; font-weight: normal; color: var(--grey); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 0 16px; }
  .quad { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font: 12px Arial, sans-serif; }
  svg text:not([fill]) { fill: var(--slate); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; color: var(--grey); font-size: 12px; font-weight: normal; padding: 0 6px 8px; }
  td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; } th.n { text-align: right; }
  .quotes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  blockquote { margin: 0; background: var(--bg); border-left: 3px solid var(--blue); border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 14px; }
  blockquote cite { display: block; color: var(--grey); font-size: 12px; font-style: normal; margin-bottom: 4px; }
  .empty { text-align: center; color: var(--grey); padding: 48px 16px; }
  .empty b { display: block; color: var(--slate); font-size: 18px; margin-bottom: 4px; }
  .foot { color: var(--grey); font-size: 13px; margin-top: 20px; }
  @media (max-width: 760px) { .quad { grid-template-columns: 1fr; } .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { .row { grid-template-columns: minmax(0, 1fr) 64px; } .row .bar { display: none; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="in">
    <div class="brand">
      <img src="/logo.svg" alt="ASEAN emblem">
      <div><h1>AMConnect survey results</h1><div class="sub"><span class="live"></span><span id="updated">Loading…</span></div></div>
    </div>
    <div class="controls">
      <label for="role" class="sub">Role</label>
      <select id="role"><option value="">All roles</option></select>
      <label for="order" class="sub">Option order</label>
      <select id="order"><option value="">All orders</option></select>
      <a class="btn primary" href="/admin/export.xlsx">Download Excel</a>
      <a class="btn" href="/admin/manage">Manage responses</a>
      <a class="btn ghost" href="/admin/logout">Log out</a>
    </div>
  </div>
  <div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
</div>
<main id="out"></main>
<script>
const out = document.getElementById('out');
const roleSel = document.getElementById('role');
const orderSel = document.getElementById('order');
const pct = x => `${Math.round(x * 100)}%`;
function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
const svg = (tag, attrs = {}, text) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};
function card(parent, title, note, chip) {
  const c = el('section', { class: 'card' });
  const h = el('h2');
  if (chip) h.append(el('span', { class: 'chip' }, chip));
  h.append(document.createTextNode(title));
  c.append(h);
  if (note) c.append(el('p', { class: 'note' }, note));
  parent.append(c);
  return c;
}
function tile(parent, label, value, cls = '') {
  const t = el('div', { class: `tile ${cls}` });
  t.append(el('div', { class: 'label' }, label), el('div', { class: `value${String(value).length > 6 ? ' small' : ''}` }, value));
  parent.append(t);
}

function quadrant(d) {
  const W = 480, H = 360, P = 44;
  const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Value against difficulty for each information area. The table beside it lists the same data.' });
  const max = Math.max(0.05, ...d.quadrant.map(q => Math.max(q.value, q.difficulty))) * 1.15;
  const x = v => P + (v / max) * (W - 2 * P), y = v => H - P - (v / max) * (H - 2 * P);
  const mx = x(d.quadrant_mean.difficulty), my = y(d.quadrant_mean.value);
  s.append(svg('text', { x: mx + 4, y: P + 12, fill: '#6D6E71' }, 'average'),
           svg('text', { x: W - P, y: my - 5, 'text-anchor': 'end', fill: '#6D6E71' }, 'average'));
  s.append(svg('line', { x1: mx, x2: mx, y1: P, y2: H - P, stroke: '#C9CBCD', 'stroke-dasharray': '4 4' }),
           svg('line', { x1: P, x2: W - P, y1: my, y2: my, stroke: '#C9CBCD', 'stroke-dasharray': '4 4' }),
           svg('line', { x1: P, x2: W - P, y1: H - P, y2: H - P, stroke: '#6D6E71' }),
           svg('line', { x1: P, x2: P, y1: P, y2: H - P, stroke: '#6D6E71' }),
           svg('text', { x: W / 2, y: H - 12, 'text-anchor': 'middle', fill: '#6D6E71' }, 'Harder to access →'),
           svg('text', { x: 14, y: H / 2, 'text-anchor': 'middle', fill: '#6D6E71', transform: `rotate(-90 14 ${H / 2})` }, 'More valuable →'));
  d.quadrant.forEach((q, i) => {
    const g = svg('g');
    g.append(svg('title', {}, `${q.code} ${q.label}: value ${pct(q.value)}, difficulty ${pct(q.difficulty)}`));
    const cx = x(q.difficulty), cy = y(q.value);
    g.append(svg('circle', { cx, cy, r: 11, fill: '#0060A9', stroke: '#fff', 'stroke-width': 2 }),
             svg('text', { x: cx, y: cy + 4, 'text-anchor': 'middle', fill: '#fff', 'font-weight': 'bold' }, i + 1));
    s.append(g);
  });
  return s;
}

async function load() {
  const role = roleSel.value, order = orderSel.value;
  const qs = new URLSearchParams(Object.entries({ role, order }).filter(([, v]) => v));
  const r = await fetch('/admin/results.json' + (qs.toString() ? `?${qs}` : '')).catch(() => ({ ok: false, status: 0 }));
  if (r.status === 401) { location.href = '/admin'; return; }  // session ended
  if (!r.ok) { document.getElementById('updated').textContent = 'Could not load results. Retrying in 30 seconds.'; return; }
  const d = await r.json();
  const def = d.questions_def;
  const roleQ = def.questions.find(q => q.id === 'role');
  const labelOf = (qid, oid) => (def.questions.find(q => q.id === qid)?.options || []).find(o => o.id === oid)?.label || oid;
  if (roleQ) {  // rebuilt on every refresh so the counts stay live; keeps the current selection
    roleSel.replaceChildren(el('option', { value: '' }, `All roles (${d.total})`),
      ...roleQ.options.map(o => el('option', { value: o.id }, `${o.label} (${d.by_role[o.id] || 0})`)));
    roleSel.value = role;
  }
  orderSel.replaceChildren(el('option', { value: '' }, 'All orders'),
    el('option', { value: 'fixed' }, `Fixed order (${d.by_order.fixed})`),
    el('option', { value: 'shuffled' }, `Shuffled (${d.by_order.shuffled})`));
  orderSel.value = order;
  const frag = document.createDocumentFragment();

  // KPI tiles
  const tiles = el('div', { class: 'tiles' });
  tile(tiles, role ? `Responses: ${labelOf('role', role)}` : 'Responses', d.n, 'hero');
  Object.entries(d.by_src).sort((a, b) => b[1] - a[1]).forEach(([s, n]) => tile(tiles, `From ${s === 'direct' ? 'direct link' : s}`, n));
  const topRole = Object.entries(d.by_role).sort((a, b) => b[1] - a[1])[0];
  if (topRole && !role) tile(tiles, 'Largest group', labelOf('role', topRole[0]));
  tile(tiles, 'Comments', d.comments.filter(o => o.q === 'comments').length);
  frag.append(tiles);

  if (!d.n) {
    const c = card(frag, '');
    c.replaceChildren(el('div', { class: 'empty' }));
    c.firstChild.append(el('b', {}, 'No responses yet'), document.createTextNode('Results appear here as soon as the first survey is submitted.'));
    out.replaceChildren(frag); stamp(); return;
  }
  if (d.small) frag.append(el('div', { class: 'warn' }, `Only ${d.n} response${d.n === 1 ? '' : 's'} in this view. Read the counts, not the percentages.`));

  // Role breakdown
  if (!role && roleQ) {
    const c = card(frag, 'Who answered', null, roleQ.code);
    const counts = d.by_role;
    roleQ.options.map(o => [o, counts[o.id] || 0]).sort((a, b) => b[1] - a[1]).forEach(([o, n]) => {
      const row = el('div', { class: 'row', title: `${o.label}: ${n} of ${d.n}` });
      const name = el('div', { class: 'opt' }); name.append(el('span', { class: 'code' }, `${roleQ.code}.${o.code}`), document.createTextNode(o.label));
      const bar = el('div', { class: 'bar' }); const fill = el('i'); fill.style.width = pct(n / d.n); bar.append(fill);
      const num = el('div', { class: 'num' }, n); num.append(el('small', {}, pct(n / d.n)));
      row.append(name, bar, num); c.append(row);
    });
  }

  // Value x difficulty
  if (d.quadrant) {
    const c = card(frag, 'Value × difficulty', 'Each information area placed by its score for "most valuable" (Q2) against "hardest to access" (Q3). Dashed lines are the averages.');
    d.quadrant.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
    const wrap = el('div', { class: 'quad' });
    const t = el('table');
    const hr = el('tr'); [['#'], ['Information area'], ['Value', 'n'], ['Difficulty', 'n']].forEach(([h, c2]) => hr.append(el('th', c2 ? { class: c2 } : {}, h))); t.append(hr);
    d.quadrant.forEach((q, i) => {
      const tr = el('tr');
      tr.append(el('td', {}, i + 1));
      const name = el('td', { class: 'opt' }); name.append(el('span', { class: 'code' }, q.code), document.createTextNode(q.label)); tr.append(name);
      tr.append(el('td', { class: 'n' }, pct(q.value)), el('td', { class: 'n' }, pct(q.difficulty)));
      t.append(tr);
    });
    wrap.append(quadrant(d), t);
    c.append(wrap);
  }

  // Ranked questions
  const grid = el('div', { class: 'grid2' });
  d.questions.forEach(q => {
    const c = card(grid, q.text, 'Bar: weighted score (rank 1 = 3 points, 2 = 2, 3 = 1) as a share of the maximum. Number: respondents with it in their top 3.', q.code);
    q.options.forEach(o => {
      const row = el('div', { class: 'row', title: `${o.label}: score ${pct(o.share)}, in top 3 for ${o.count} of ${d.n}` });
      const name = el('div', { class: 'opt' }); name.append(el('span', { class: 'code' }, o.code), document.createTextNode(o.label));
      if (o.module) name.append(el('span', { class: 'mod' }, o.module));
      const bar = el('div', { class: 'bar' }); const fill = el('i'); fill.style.width = pct(o.share); bar.append(fill);
      const num = el('div', { class: 'num' }, d.small ? `${o.count}` : pct(o.pct)); num.append(el('small', {}, d.small ? `of ${d.n}` : `${o.count} people`));
      row.append(name, bar, num); c.append(row);
    });
  });
  frag.append(grid);

  // Order bias: share of picks by screen position, fixed order vs shuffled
  const ob = card(frag, 'Order bias', 'Share of each question\'s picks that went to the option shown at each screen position (Other and None of these are left out). If people ignore the order, every position gets about the same share. In shuffled responses the option at each position is random, so a high share for the top positions means people tick whatever is shown first. Ignores the option-order filter.');
  const og = el('div', { class: 'grid2' });
  d.questions.forEach(q => {
    const { fixed, shuffled } = q.position, m = fixed.picks.length;
    const sum = a => a.reduce((x, y) => x + y, 0);
    const share = (g, i) => g.n < 5 ? '–' : pct(g.picks[i] / (sum(g.picks) || 1));
    const top3 = g => g.n < 5 ? '–' : pct(sum(g.picks.slice(0, 3)) / (sum(g.picks) || 1));
    const t = el('table');
    const h = el('tr'); [`${q.code} position`, `Fixed (${fixed.n})`, `Shuffled (${shuffled.n})`, 'If no bias'].forEach(x => h.append(el('th', {}, x)));
    t.append(h);
    for (let i = 0; i < m; i++) {
      const tr = el('tr'); [`${i + 1}`, share(fixed, i), share(shuffled, i), pct(1 / m)].forEach(x => tr.append(el('td', {}, x)));
      t.append(tr);
    }
    const tr = el('tr'); [el('b', {}, 'Top 3 positions'), el('b', {}, top3(fixed)), el('b', {}, top3(shuffled)), el('b', {}, pct(3 / m))].forEach(x => { const td = el('td'); td.append(x); tr.append(td); });
    t.append(tr);
    const box = el('div', { style: 'margin-bottom:16px' }); box.append(t); og.append(box);
  });
  ob.append(og, el('p', { class: 'note' }, '– = fewer than 5 responses. Fixed-order responses came before shuffling started, so they also differ in time and audience.'));

  // Free text
  const quotes = (title, note, items) => {
    if (!items.length) return;
    const c = card(frag, title, note);
    const g = el('div', { class: 'quotes' });
    items.forEach(([cite, text]) => { const b = el('blockquote'); if (cite) b.append(el('cite', {}, cite)); b.append(document.createTextNode(text)); g.append(b); });
    c.append(g);
  };
  const qcode = id => def.questions.find(q => q.id === id)?.code || id;
  quotes('"Other" answers', 'Group these into themes by hand.', d.other.map(o => [`${qcode(o.q)} Other`, o.text]));
  quotes('Comments', `Answers to ${qcode('comments')}, the open question.`, d.comments.filter(o => o.q === 'comments').map(o => ['', o.text]));
  quotes('About the respondents', `Answers to ${qcode('about')}: who people are and whether they may be contacted.`, d.comments.filter(o => o.q === 'about').map(o => ['', o.text]));

  out.replaceChildren(frag);
  stamp();
}
function stamp() { document.getElementById('updated').textContent = `Live. Updated ${new Date().toLocaleTimeString()}, refreshes every 30 seconds.`; }
roleSel.addEventListener('change', load);
orderSel.addEventListener('change', load);
load(); setInterval(load, 30000);
</script>
</body>
</html>
